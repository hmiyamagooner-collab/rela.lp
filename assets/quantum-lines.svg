      <g stroke="#51adff" stroke-width="1.4" opacity=".8">
        <rect x="76" y="66" width="9" height="9"/>
        <rect x="150" y="136" width="9" height="9"/>
        <rect x="46" y="156" width="7" height="7"/>
      </g>
      <g fill="#73c8ff" opacity=".75">
        <circle cx="20" cy="40" r="2"/>
        <circle cx="140" cy="140" r="2"/>
        <circle cx="50" cy="120" r="2"/>
