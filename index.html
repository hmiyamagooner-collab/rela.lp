<style>
:root{--bg:#03040a;--line:rgba(120,150,220,.18);--ink:#eef2ff;--ink-soft:#aab4d4;--ink-dim:#68739a;--cyan:#4fd8ff;--blue:#3d7bff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;overflow-x:hidden}

/* ---- 背景写真(全画面) ---- */
.stage{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:60px 24px 70px;position:relative;overflow:hidden;isolation:isolate}
.stage > *:not(.bg-sweep){position:relative;z-index:1}
.stage::before{content:"";position:absolute;inset:0;z-index:-2;
  background:url(assets/hero.webp) center bottom / cover no-repeat}
.stage::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 62% 46% at 50% 44%, rgba(3,4,10,.42), transparent 72%),
             linear-gradient(180deg, rgba(3,4,10,.5), transparent 16% 84%, rgba(3,4,10,.3))}

/* ---- オープニング: ロゴが奥からジワっと浮かび上がる ---- */
.logo-emerge{width:clamp(230px,36vw,330px);
  opacity:0;transform:scale(.5);filter:blur(18px) brightness(.4);
  animation:emerge 3.4s cubic-bezier(.22,.61,.2,1) .4s forwards}
@keyframes emerge{
  0%{opacity:0;transform:scale(.5);filter:blur(18px) brightness(.4) drop-shadow(0 0 0 rgba(122,108,245,0))}
  45%{opacity:.55;filter:blur(9px) brightness(.65) drop-shadow(0 0 20px rgba(122,108,245,.25))}
  100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1) drop-shadow(0 0 18px rgba(61,123,255,.28))}
}
/* 浮上完了後、静かに呼吸する発光 */
.logo-wrap{animation:breathe 5s ease-in-out 4s infinite}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}

/* ---- 後続要素の段階フェード ---- */
.seq{opacity:0;transform:translateY(16px);animation:rise .9s ease forwards}
.s1{animation-delay:2.9s}.s2{animation-delay:3.3s}.s3{animation-delay:3.7s}
.s4{animation-delay:4.1s}.s5{animation-delay:4.5s}.s6{animation-delay:4.9s}
@keyframes rise{to{opacity:1;transform:none}}

h1{font-family:'Shippori Mincho',serif;font-weight:600;line-height:1.75;
  font-size:clamp(26px,4.6vw,46px);letter-spacing:.08em;margin:34px 0 8px}
h1 .big{font-size:1.32em;font-weight:700}
.subline{font-family:'Shippori Mincho',serif;color:var(--ink-soft);
  font-size:clamp(14px,1.8vw,19px);letter-spacing:.22em;margin-bottom:40px}

.pills{display:flex;gap:14px;align-items:center;justify-content:center;margin-bottom:44px;flex-wrap:wrap}
.pill{font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.2em;
  padding:9px 30px;border-radius:999px;position:relative;background:rgba(3,4,10,.6)}
.pill::before{content:"";position:absolute;inset:0;border-radius:999px;padding:1.5px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pill.c::before{background:linear-gradient(120deg,#37c8f0,#3d7bff)}
.pill.v::before{background:linear-gradient(120deg,#7a6cf5,#9b5cf6)}
.pill.p::before{background:linear-gradient(120deg,#ff4d8d,#ff7ab0)}
.pills .x{color:var(--ink-dim);font-family:'Shippori Mincho',serif}

.btn{display:inline-block;text-decoration:none;border-radius:999px;font-weight:700;letter-spacing:.06em;transition:.25s}
.btn-white{background:#fff;color:#0a0d18;padding:15px 44px;font-size:15px;box-shadow:0 0 34px rgba(79,216,255,.35)}
.btn-white:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(79,216,255,.55)}
.btn-line{border:1px solid rgba(255,255,255,.4);color:var(--ink);padding:14px 38px;font-size:14px;background:rgba(3,4,10,.4)}
.btn-line:hover{border-color:var(--cyan);color:var(--cyan)}
.cta-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
.note{font-size:12px;color:var(--ink-dim);margin-top:14px}

.ribbon{margin:38px auto 0;display:inline-block;position:relative;
  font-family:'Shippori Mincho',serif;letter-spacing:.1em;
  padding:14px 42px;color:#0a0d18;background:#eef2ff;
  clip-path:polygon(0 12%,3% 0,97% 0,100% 12%,98% 50%,100% 88%,97% 100%,3% 100%,0 88%,2% 50%);
  box-shadow:0 0 30px rgba(79,216,255,.3);font-size:clamp(13px,1.8vw,16px)}
.ribbon b{color:#c22a68;font-size:1.25em}
.ribbon .gold{color:#8a6a12;font-weight:700}

.stores{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:30px;flex-wrap:wrap}
.store-badge{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:12px;padding:9px 18px;text-decoration:none;background:rgba(3,4,10,.5);
  font-size:12px;color:var(--ink-soft);line-height:1.4;text-align:left}
.store-badge b{display:block;font-size:14px;color:var(--ink)}
.store-badge .mark{font-size:22px}
.store-badge:hover{border-color:var(--cyan)}

@media (prefers-reduced-motion:reduce){
  .logo-emerge,.seq{animation:none;opacity:1;transform:none;filter:none}
  .logo-wrap{animation:none}
}
footer{position:relative;z-index:1;padding:18px 24px 28px;text-align:center;font-size:11px;color:var(--ink-dim)}
footer a{color:var(--ink-dim);text-decoration:none;margin:0 8px}
footer a:hover{color:var(--cyan)}
</style>
