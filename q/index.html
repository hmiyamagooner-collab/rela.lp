<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RELA</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="RELA connection">
<meta property="og:title" content="RELA">
<meta property="og:description" content="RELA connection">
<meta name="color-scheme" content="light dark">
<!--
  RELA QR の着地ページ(指示書 #39)。rela.info/q/<token> で、この同じ静的ページを返す(vercel.json の rewrite)。
  - 完全に静的。このページは「受け取り(redeem)」を呼ばない(メッセージアプリのリンクプレビューやクローラーが開いても、リンクが使われないように)。
  - token を、画面・DOM・title・OGP に出さない。リンクのコピーは、ボタンを押した時の操作の中だけ(location.href を渡す)。
  - 外部のスクリプト・フォント・画像を読み込まない。解析(GA・ピクセル等)も読み込まない。
-->
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1b2030;--mute:#586078;--line:#d6dae5;--accent:#d6336c;--accent2:#7048e8;--btn:#111}
@media (prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#171a30;--fg:#eceffa;--mute:#a4abc6;--line:#2c3150;--accent:#ff6fae;--accent2:#a48bff;--btn:#fff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{font-weight:800;letter-spacing:.32em;font-size:15px;color:var(--accent);text-align:center;padding-top:6px}
h1{font-size:22px;line-height:1.45;margin:4px 0 0;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:700}
ol{margin:0;padding-left:1.4em}li{margin:6px 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;font-size:16px;font-weight:700;line-height:1;font-family:inherit;border:0;cursor:pointer;text-decoration:none}
.copy{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.store{background:var(--btn);color:var(--bg)}
.note{font-size:13.5px;color:var(--mute);text-align:center;margin:0}
.msg{min-height:22px;text-align:center;font-size:14px;color:var(--accent);margin:8px 0 0}
.fallback{display:none;margin-top:10px}.fallback.show{display:block}
.fallback input{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 10px;font-size:14px}
.fallback p{font-size:13px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<main>
  <div class="brand" translate="no">RELA</div>
  <h1 id="h1">友達が、RELAのつながりを送ってくれました</h1>
  <section class="card">
    <h2 id="h-steps">つなげかた</h2>
    <ol>
      <li id="s1">RELAを開く(アプリまたはWeb)</li>
      <li id="s2">「相手の登録・分析」を開き、「QRのリンクを貼り付けて読み込む」を押す</li>
      <li id="s3">このページのリンクを貼り付ける</li>
    </ol>
  </section>
  <section>
    <button type="button" class="btn copy" id="copy">リンクをコピー</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="fallback" id="fb"><input id="fbi" type="text" readonly aria-label="link"><p id="fbp">コピーできませんでした。上のリンクを長押しして、コピーしてください。</p></div>
  </section>
  <section class="card">
    <h2 id="h-app">まだRELAを使っていない方</h2>
    <a class="btn store" id="store" href="/lp#plans" rel="noopener noreferrer">Webですぐに始める(登録無料)</a>
  </section>
  <p class="note" id="note">このリンクは、24時間・1回限りで、使えなくなります。</p>
</main>
<script>
(function () {
  var en = !/^ja/i.test(navigator.language || navigator.userLanguage || 'ja');
  var T = en ? {
    lang: 'en', h1: 'A friend sent you a RELA connection', steps: 'How to connect',
    s1: 'Open RELA (app or web)', s2: 'Open "Register & analyze a partner" and tap "Load a QR link"', s3: "Paste this page's link",
    copy: 'Copy link', copied: 'Copied!', fb: "Couldn't copy. Press and hold the link above, then copy it.",
    app: 'New to RELA?', store: 'Start on the web (free)', note: 'This link expires in 24 hours and works only once.'
  } : null;
  if (T) {
    document.documentElement.lang = T.lang;
    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
    set('h1', T.h1); set('h-steps', T.steps); set('s1', T.s1); set('s2', T.s2); set('s3', T.s3); set('copy', T.copy);
    set('fbp', T.fb); set('h-app', T.app); set('store', T.store); set('note', T.note);
    document.getElementById('store').setAttribute('href', '/en/lp#plans');   // 英語の LP の「Start on iPhone / PC」と同じ行き先(プラン選択)
  }
  var msg = document.getElementById('msg'), fb = document.getElementById('fb'), fbi = document.getElementById('fbi');
  function done() { msg.textContent = en ? 'Copied!' : 'コピーしました'; fb.classList.remove('show'); fbi.value = ''; }
  function showFallback() {   // コピーできない環境でだけ、この操作の中で、リンクを選択状態にして見せる(通常は DOM に出さない)
    fbi.value = location.href; fb.classList.add('show'); msg.textContent = '';
    try { fbi.focus(); fbi.select(); fbi.setSelectionRange(0, fbi.value.length); } catch (e) {}
  }
  function legacyCopy() {
    try {
      var ta = document.createElement('textarea'); ta.value = location.href; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      var ok = document.execCommand && document.execCommand('copy'); document.body.removeChild(ta); return !!ok;
    } catch (e) { return false; }
  }
  document.getElementById('copy').addEventListener('click', function () {
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { if (legacyCopy()) done(); else showFallback(); });
    } else if (legacyCopy()) done(); else showFallback();
  });
})();
</script>
</body>
</html>
